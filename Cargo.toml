[workspace]
resolver = "3"
members = ["crates/tokenbubble-core", "crates/tokenbubble-gpui", "tools/tokenbubble-dev"]
default-members = ["crates/tokenbubble-core", "crates/tokenbubble-gpui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

# Versions track Compi's lockfile where both use a crate, so integration does not duplicate them.
[workspace.dependencies]
base64 = "0.22"
jiff = { version = "0.2", features = ["serde"] }
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = { version = "0.8", default-features = false, features = ["parse"] }
ureq = "3.4"
tempfile = "3"
