[package]
name = "tokenbubble-gpui"
description = "TokenBubble's shared usage panel and standalone host"
version.workspace = true
edition.workspace = true
publish.workspace = true
default-run = "tokenbubble"

[dependencies]
jiff.workspace = true
tokenbubble-core = { path = "../tokenbubble-core" }

# GPUI pins match Compi so the panel embeds without a second GPUI.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
gpui = { package = "gpui-pre", version = "=0.3.8", default-features = false }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8" }

[target.'cfg(target_os = "macos")'.dependencies]
# Without font-kit, GPUI selects NoopTextSystem on macOS.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit"] }

[target.'cfg(windows)'.dependencies]
async-channel = "2.5"
raw-window-handle = "0.6"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }